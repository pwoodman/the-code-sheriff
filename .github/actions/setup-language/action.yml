name: Set up language toolchain
description: Install the compiler/runtime needed to format and lint one language.
inputs:
  language:
    required: true
    description: csharp | javascript | rust | go | python | java | sql
runs:
  using: composite
  steps:
    - name: Python extras
      if: inputs.language == 'python'
      shell: bash
      run: pip install "ruff>=0.8"

    - name: SQLFluff
      if: inputs.language == 'sql'
      shell: bash
      run: pip install "sqlfluff>=3.2"

    - name: Node.js
      if: inputs.language == 'javascript'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"

    - name: Go
      if: inputs.language == 'go'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: "1.23"

    - name: Rust
      if: inputs.language == 'rust'
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: rustfmt,clippy

    - name: Java
      if: inputs.language == 'java'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "21"

    - name: .NET
      if: inputs.language == 'csharp'
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: "8.0.x"

    - name: CSharpier
      if: inputs.language == 'csharp'
      shell: bash
      run: dotnet tool install -g csharpier || dotnet tool update -g csharpier
