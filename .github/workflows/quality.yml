# This repo uses [quality.ci] mode = "both", so PRs run quality-full.yml
# (detect, format, lint, DRY, security, compile, impact, coverage, UI, version).
# Consumers that keep mode = "local" only run github_gates here (now includes
# format + lint). Dispatch Quality gates (full suite) or set mode github/both
# for the heavy matrix. Compile/UI still self-skip when they do not apply.

name: Quality gates

on:
  workflow_call:
    inputs:
      full_suite:
        description: Run heavy gates on Actions even when ci.mode=local
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the heavy suite on GitHub (ignores ci.mode=local)
        type: boolean
        default: false

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  plan:
    name: 0 · Plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      mode: ${{ steps.plan.outputs.mode }}
      ui: ${{ steps.plan.outputs.ui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          install-binaries: "false"
      - name: Decide local vs full
        id: plan
        env:
          QUALITY_CI_FULL: ${{ github.event.inputs.full_suite == 'true' && '1' || '' }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from quality_gates.ci_plan import github_runs_full_suite, ui_allowed_on_github
          from quality_gates.config import load_config
          from quality_gates.paths import project_root
          config = load_config(project_root())
          full = github_runs_full_suite(config)
          ui = ui_allowed_on_github(config)
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              f"full={'true' if full else 'false'}\nmode={config.ci_mode}\nui={'true' if ui else 'false'}\n"
          )
          print(f"ci.mode={config.ci_mode} full_on_github={full} ui_on_github={ui}")
          PY

  local:
    name: Cheap GitHub gates
    needs: plan
    if: needs.plan.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          install-binaries: "false"
      - name: Format, lint, impact, audit, version, review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ci.mode=${{ needs.plan.outputs.mode }} — github_gates (format, lint, impact, audit, version, review)."
          echo "Detect/format/lint are cheap and belong on PRs. DRY/security/compile/coverage/UI stay local unless mode is github/both."
          quality run --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-report
          if-no-files-found: ignore
          path: |
            .quality-reports/quality-report.html
            .quality-reports/quality-report.md
            .quality-reports/quality-report.json
            .quality-reports/quality-report.sarif
            .quality-reports/diagnostics.json
      - name: Publish SARIF to code scanning
        if: always() && hashFiles('.quality-reports/quality-report.sarif') != ''
        continue-on-error: true
        run: |
          # Prefer the GitHub code-scanning API so we do not pin a moving
          # codeql-action SHA here. Forks without security-events still keep
          # the artifact above.
          if [ -n "${GITHUB_TOKEN:-}" ] && [ -f .quality-reports/quality-report.sarif ]; then
            gzip -c .quality-reports/quality-report.sarif | base64 -w0 > /tmp/quality.sarif.b64
            python3 - <<'PY'
          import json, os, urllib.request
          sarif = open("/tmp/quality.sarif.b64", encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/code-scanning/sarifs",
              data=json.dumps({
                  "commit_sha": os.environ.get("GITHUB_SHA"),
                  "ref": os.environ.get("GITHUB_REF"),
                  "sarif": sarif,
                  "tool_name": "quality-gates",
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(req, timeout=30)
              print("uploaded SARIF")
          except Exception as exc:
              print(f"SARIF upload skipped: {exc}")
          PY
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  full:
    name: Full suite
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/quality-full.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      checks: write

  summary:
    name: The Code Sheriff
    needs: [plan, local, full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs that ran for this ci.mode
        run: |
          python3 - <<'PY'
          import sys
          full = "${{ needs.plan.outputs.full }}" == "true"
          results = {
            "plan": "${{ needs.plan.result }}",
            "local": "${{ needs.local.result }}",
            "full": "${{ needs.full.result }}",
          }
          print("full=", full)
          print("\n".join(f"{k}={v}" for k, v in results.items()))
          blocking = ["plan", "full"] if full else ["plan", "local"]
          # The unselected branch is intentionally skipped. Every selected job
          # is required to finish successfully; cancelled, skipped, missing, or
          # failed work can never satisfy the durable summary check.
          bad = [name for name in blocking if results[name] != "success"]
          if bad:
              print("failed gates:", ", ".join(bad))
              sys.exit(1)
          print("required gates passed")
          PY
