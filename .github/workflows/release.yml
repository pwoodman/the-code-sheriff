name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify version and build
        run: |
          python -m pip install build
          python -c "import pathlib,re; p=pathlib.Path('pyproject.toml').read_text(); s=pathlib.Path('src/quality_gates/__init__.py').read_text(); a=re.search(r'^version = \"([^\"]+)',p,re.M).group(1); b=re.search(r'^__version__ = \"([^\"]+)',s,re.M).group(1); assert a == b == '${{ github.ref_name }}'.removeprefix('v'), (a,b)"
          python -m build
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
