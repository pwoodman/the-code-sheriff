name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", lint: true}
          - {os: ubuntu-latest, python: "3.14", lint: false}
          - {os: macos-latest, python: "3.12", lint: false}
          - {os: windows-latest, python: "3.13", lint: false}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest --cov --cov-report=term-missing --cov-fail-under=50 --tb=short
      - name: Ruff
        if: matrix.lint
        run: python -m quality_gates.github_annotate ruff src tests
      - name: Build and inspect wheel
        if: matrix.lint
        run: |
          python -m pip install build
          python -m build
          python -c "import glob,zipfile; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); required=['quality_gates/bundled/tool-manifest.json','quality_gates/bundled/report.schema.json','quality_gates/tooling_js/package-lock.json']; assert all(x in n for x in required), n"
