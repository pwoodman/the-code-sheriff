services:
  webhook:
    image: node:22-alpine
    working_dir: /app
    command: ["npx", "--yes", "wrangler", "dev", "--ip", "0.0.0.0", "--port", "8787"]
    volumes:
      - ./worker:/app
    environment:
      WEBHOOK_SECRET: ${QUALITY_APP_WEBHOOK_SECRET:-}
      DISPATCH_TOKEN: ${QUALITY_APP_DISPATCH_TOKEN:-}
      HOME_REPO: ${QUALITY_APP_HOME_REPO:-pwoodman/the-code-sheriff}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
    ports:
      - "8787:8787"
    networks:
      - sheriff
networks:
  sheriff:
    driver: bridge
