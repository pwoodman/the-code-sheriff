target-version = "py311"
line-length = 88
extend-exclude = [
  ".git",
  ".quality-gates",
  "node_modules",
  "dist",
  "build",
  "target",
  "vendor",
  ".venv",
  "tests/fixtures",
]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
