# Default quality-gates config for this repository.
# Copy to a consuming repo and tweak. Every key is optional.

[quality]
# auto | explicit list: csharp, javascript, typescript, react, rust, go, python, java, sql
languages = ["auto"]

# Gates that fail CI when they report errors. review never fails the
# build unless you add it here — it posts findings as a PR comment.
fail_on = ["format", "lint", "dry", "security", "compile", "contract", "impact", "test", "coverage", "audit", "ui", "version"]

# pr-only | always | never
ai_review = "pr-only"

# observe = never block; adopt = new issues only vs baseline; enforce = fail_on
policy = "enforce"
baseline = ".quality-baseline.json"
comment_on_pr = true

# Tool installation is never performed by normal gates. `quality doctor --install`
# may install only manifest artifacts with a verified SHA-256.
auto_install = false

# Local runs default to trusted; pull-request runs default to untrusted unless
# explicitly overridden. Project builds and tests require trusted mode.
trust = "trusted"

# This toolkit dogfoods the full suite on GitHub. Consumers still default to
# local-first via `quality init` (format/lint also run on PRs — they are cheap).
# local  = heavy gates on developer machines; Actions runs github_gates only.
# github = full suite on Actions. UI still off unless [quality.ui] on_github.
# both   = local hooks AND the full Actions suite.
[quality.ci]
mode = "both"
github_gates = ["format", "lint", "impact", "audit", "version", "review"]

[quality.compile]
# Never compile if secrets/CVEs/SAST errors are present, or if scanners skipped.
require_security = true

[quality.version]
# if-present | always | never
require_changelog = "if-present"

# Playwright/Cypress: run only specs that cover the git diff. This toolkit
# repo has no UI app, so the gate skips. Consumers with e2e tests get the
# selection for free. Browser installs stay off GitHub unless on_github=true.
[quality.ui]
select = "changed"                 # changed | all
framework = "auto"                 # auto | playwright | cypress
on_github = false
coverage_map = ".quality-reports/ui-coverage.json"

[quality.impact]
# Walk this many import hops for upstream (deps) and downstream (consumers).
depth = 4
# Fail when a consumer of the change was not updated and has no covering test.
require_downstream = true
# If true, also fail when a changed file has no test (otherwise warning only).
require_own_tests = false

# 80% is the package default (industry / ISTQB-style). This toolkit's own
# suite currently measures ~55% line coverage — keep a floor so coverage
# cannot regress, without pretending a CLI helper is an 80% product.
[quality.coverage]
line = 55
branch = 0
tool = "auto"                      # auto | pytest | jest | vitest | go | existing

# 120-point static inspection. Fail only on HIGH-confidence P0 evidence.
# Checks that need a browser, HTTP runtime, or an API this repo does not
# have are not_applicable / not_statically_provable — not failures.
[quality.audit]
fail_on_priority = ["P0"]
min_confidence = "HIGH"

[quality.detect]
exclude = [
  ".git",
  ".quality-gates",
  ".quality-reports",
  "node_modules",
  "dist",
  "build",
  "target",
  "vendor",
  ".venv",
  "venv",
  "__pycache__",
  ".ruff_cache",
  ".pytest_cache",
  "tests/fixtures",
  "tooling",
  "configs",
  "src/quality_gates/bundled",
  "src/quality_gates/tooling_js",
  ".coverage",
  "htmlcov",
  ".zvec-grep",
  ".cursor",
  ".idea",
]

[quality.format]
# If the project already has prettier/eslint/ruff/etc, prefer those binaries.
prefer_project_tools = true

[quality.lint]
prefer_project_tools = true

[quality.dry]
# jscpd: a clone is reported when both token and line floors are met.
min_lines = 12
min_tokens = 50
# Fail when duplicated tokens exceed this percent of the corpus. 0 = any clone fails.
threshold = 0
ignore = [
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/target/**",
  "**/vendor/**",
  "**/.git/**",
  "**/tests/fixtures/**",
  "**/src/quality_gates/bundled/**",
  "**/src/quality_gates/tooling_js/**",
  "**/tooling/**",
  "**/configs/**",
  "**/.github/workflows/**",
]

[quality.sql]
# ansi | postgres | mysql | tsql | bigquery | snowflake | sqlite | spark | redshift | duckdb
dialect = "ansi"

[quality.review]
# openai | anthropic | auto | off  (github-models is retired; treated as heuristic)
provider = "auto"
max_diff_bytes = 120000
model = ""
# auto | agentic | ensemble | single | heuristic
mode = "auto"
passes = 3
tool_rounds = 4
rules_dir = ".quality/rules"
related_files = 8
related_bytes = 24000
validate = true
inline_comments = true
check_run = true

# A workflow permission change is an authorization-sensitive change. Keep its
# negative/permission regression suite explicit so selective runs have current
# executable evidence rather than relying on review text alone.
[quality.authorization]
command = ["uv", "run", "pytest", "-q", "tests/test_security.py"]
timeout = 600
