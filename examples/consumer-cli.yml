---
name: Quality gates (CLI)

# Drop-in workflow pinned to reviewed action commits.
# With quality.toml ci.mode=local (the default), this job runs format, lint,
# impact, audit, version, and PR review. DRY/security/compile/coverage/UI stay
# on developer machines. Playwright/Cypress stay off Actions unless on_github.

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run heavy gates on GitHub
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install quality-gates
        run: pip install "quality-gates==1.6.0"
      - name: Run gates (cheap unless full_suite / ci.mode=github|both)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_CI_FULL: >-
            ${{ github.event.inputs.full_suite == 'true' && '1' || '' }}
        run: >-
          quality run --base
          "origin/${{ github.base_ref || github.event.repository.default_branch }}"
