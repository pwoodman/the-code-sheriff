name: Quality gates (CLI)

# Drop-in workflow. Replace YOUR_ORG.
# With quality.toml ci.mode=local (the default), this job runs impact + version +
# PR review. Heavy format/lint/DRY/security/compile/ui stay on developer machines.
# Playwright/Cypress stay off Actions unless QUALITY_UI_ON_GITHUB=1.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run heavy gates on GitHub
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality-gates
        run: pip install "git+https://github.com/YOUR_ORG/quality-gates.git@v1"
      - name: Run gates (cheap unless full_suite / ci.mode=github|both)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_CI_FULL: ${{ github.event.inputs.full_suite == 'true' && '1' || '' }}
        run: quality run --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"
