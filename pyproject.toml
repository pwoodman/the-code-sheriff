[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quality-gates"
version = "1.14.0"
description = "The Code Sheriff: polyglot quality gates for every change."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "The Code Sheriff" }]
keywords = ["lint", "format", "security", "ci", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
python = ["ruff>=0.8"]
sql = ["sqlfluff>=3.2"]
security = ["semgrep>=1.90"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]
all = ["ruff>=0.8", "sqlfluff>=3.2", "semgrep>=1.90", "pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
quality = "quality_gates.cli:main"
codesheriff = "quality_gates.cli:main"

[project.urls]
Homepage = "https://github.com/pwoodman/the-code-sheriff"
Repository = "https://github.com/pwoodman/the-code-sheriff"
Issues = "https://github.com/pwoodman/the-code-sheriff/issues"
Changelog = "https://github.com/pwoodman/the-code-sheriff/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gates"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "quality_gates/bundled"
"tests/fixtures/review_bench" = "quality_gates/bundled/review_bench"
"tooling/js/package.json" = "quality_gates/tooling_js/package.json"
"tooling/js/package-lock.json" = "quality_gates/tooling_js/package-lock.json"
"tooling/js/eslint.config.js" = "quality_gates/tooling_js/eslint.config.js"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
  ".quality-gates",
  "tests/fixtures",
  "tooling",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["quality_gates"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["quality_gates"]
branch = true
omit = [
  "*/tests/*",
  "*/bundled/*",
  "*/tooling_js/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
